[versions]
# ---- 构建工具链（锁定原则见 技术方案定案.md §1/§2）----
agp = "9.4.1"
kotlin = "2.3.21"          # 特意不用 2.4：KSP 尚无 2.4 配套版本（截至 2026-10）
ksp = "2.3.12"
gradleWrapper = "9.8.0"

# ---- UI ----
composeBom = "2026.09.00"
material3 = "1.4.0"        # 通过 BOM 管理，此处仅备忘；若 BOM 内版本不同以 BOM 为准
activityCompose = "1.13.0"

# ---- 数据与注入（骨架阶段即引入，功能阶段使用）----
room = "2.8.5"
hilt = "2.60.1"
androidxHilt = "1.4.0"      # androidx.hilt（hilt-navigation-compose），2026-10-02 核实稳定版
kotlinxSerialization = "1.9.0"

# ---- 其他 ----
coil = "3.6.3"
vico = "3.3.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# ---- 测试 ----
junit4 = { group = "junit", name = "junit", version = "4.13.2" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# ---- 导航与 Hilt-Compose 桥接（2026-10-02 核实稳定版） ----
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.10.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Kotlin 由 AGP 9 内置，不再单独应用 kotlin-android 插件（官方迁移指南 developer.android.com/build/migrate-to-built-in-kotlin）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
